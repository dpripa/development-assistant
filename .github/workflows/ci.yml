name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.2"

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

      - name: Lint PHP
        run: composer run lint

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check release version metadata
        run: npm run version:check

      - name: Lint CSS
        run: npm run lint-style

      - name: Lint TypeScript
        run: npm run lint-script

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build assets
        run: npm run build

  integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run isolated WordPress tests
        env:
          WP_CORE_DOWNLOAD_URL: https://wordpress.org/wordpress-7.1.tar.gz
        run: make test

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate configuration
        run: docker compose config --quiet
